<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Random forest frente a gradient boosting</title>
<desc>Left: a random forest builds deep trees in parallel, each from a random sample of the training data, and averages their votes. Right: gradient boosting builds small trees one after another; each corrects the error left by the previous ones, and the trees are added up.</desc>
<defs>
<marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="440" rx="12" fill="#FFFFFF"/>
<rect x="30" y="20" width="300" height="392" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="350" y="20" width="300" height="392" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<g text-anchor="middle" dominant-baseline="central">
<text x="180" y="46" font-size="15" font-weight="600" fill="#2C2C2A">Random forest</text>
<text x="180" y="66" font-size="12" fill="#5F5E5A">Árboles profundos, en paralelo</text>
<text x="180" y="84" font-size="12" fill="#5F5E5A">cada uno con una muestra al azar</text>
<text x="500" y="46" font-size="15" font-weight="600" fill="#2C2C2A">Gradient boosting</text>
<text x="500" y="66" font-size="12" fill="#5F5E5A">Árboles pequeños, en secuencia</text>
<text x="500" y="84" font-size="12" fill="#5F5E5A">cada uno corrige lo que aún falla</text>
</g>
<rect x="85" y="104" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<rect x="405" y="104" width="190" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
